<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f0d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2e1a;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle radial glow behind frog -->
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.2" fill="#4CAF50" opacity="0.12" />
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- Frog emoji -->
  <text x="600" y="295" font-size="180" text-anchor="middle" dominant-baseline="middle">🐸</text>

  <!-- App name -->
  <text x="600" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="88" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">
    Frogify
  </text>

  <!-- Tagline -->
  <text x="600" y="487" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="32" font-weight="400" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="0.5">
    Take a picture. Turn yourself into a frog.
  </text>

  <!-- Domain pill -->
  <rect x="492" y="530" width="216" height="46" rx="23" fill="rgba(76,175,80,0.2)" stroke="#4CAF50" stroke-width="1.5" stroke-opacity="0.5" />
  <text x="600" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600" fill="#4CAF50" text-anchor="middle">
    frogify.org
  </text>
</svg>
