<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / Home Screen Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Frogify">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐸</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%234CAF50%22/><text x=%2250%22 y=%2250%22 font-size=%2270%22 text-anchor=%22middle%22 dy=%22.35em%22>🐸</text></svg>">
    
    <!-- Social Preview Tags (Open Graph) -->
    <title>Frogify - Turn Yourself Into a Frog!</title>
    <meta name="title" content="Frogify - Turn Yourself Into a Frog!">
    <meta name="description" content="A fun AI web app that turns anyone into a realistic humanoid frog. Open the camera, snap a pic, and get frogified!">
    
    <!-- Open Graph / Facebook / iMessage -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://frogify.netlify.app/">
    <meta property="og:title" content="Frogify 🐸">
    <meta property="og:description" content="Snap a pic and let AI turn you into a realistic humanoid frog!">
    <!-- Using a giant emoji data URI for the preview image as a fallback since we don't have a static image file -->
    <meta property="og:image" content="https://placehold.co/1200x630/4CAF50/FFF?text=Frogify+%F0%9F%90%B8&font=Montserrat">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://frogify.netlify.app/">
    <meta property="twitter:title" content="Frogify 🐸">
    <meta property="twitter:description" content="Snap a pic and let AI turn you into a realistic humanoid frog!">
    <meta property="twitter:image" content="https://placehold.co/1200x630/4CAF50/FFF?text=Frogify+%F0%9F%90%B8&font=Montserrat">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="camera-view" class="view active">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display: none;"></canvas>
            <div class="camera-controls">
                <button id="flip-btn" class="control-button" aria-label="Flip Camera">
                    <svg class="button-icon-svg" viewBox="0 0 24 24" width="28" height="28" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"></polyline>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                        <polyline points="7 23 3 19 7 15"></polyline>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    </svg>
                </button>
                <button id="capture-btn" class="capture-button">
                    <span class="button-icon">🐸</span>
                </button>
                <div class="control-spacer"></div>
            </div>
        </div>
        
        <div id="loading-view" class="view">
            <div class="loading-content">
                <div class="pond-ripples">
                    <div class="ripple ripple-1"></div>
                    <div class="ripple ripple-2"></div>
                    <div class="ripple ripple-3"></div>
                </div>
                <p class="pulsing-text">Transforming into a frog...</p>
            </div>
        </div>
        
        <div id="result-view" class="view">
            <img id="result-image" alt="Frog transformation result">
            <div class="result-controls">
                <button id="retry-btn" class="retry-button">New Frog</button>
                <button id="save-btn" class="save-button">Share Frog</button>
            </div>
        </div>
        
        <div id="error-view" class="view">
            <div class="error-content">
                <p id="error-message">Something went wrong</p>
                <button id="error-retry-btn" class="retry-button">Try Again</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
